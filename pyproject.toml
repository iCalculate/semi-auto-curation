[project]
name = "semi-auto-curation"
version = "0.1.0"
description = "Desktop app for high-throughput IV data processing and analysis."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
]

[project.scripts]
semi-auto-curation = "semi_auto_curation.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semi_auto_curation"]

[tool.uv]
package = true
